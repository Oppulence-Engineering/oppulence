name: Connector Deployment Contract

on:
  pull_request:
    paths:
      - "charts/hydra/**"
      - "charts/rowboat-api/**"
      - "charts/rowboat-www/**"
      - "charts/oauth-consent/**"
      - "apps/rowboat-www/app/api/connectors/**"
      - "apps/rowboat-www/lib/auth/origin.ts"
      - "apps/rowboat-www/lib/connectors/hosted-oauth.ts"
      - "apps/rowboat-api/internal/connectors/default_connectors.json"
      - "apps/rowboat-api/internal/connectors/registry.go"
      - "apps/oauth-consent/**"
      - "apps/x/package.json"
      - "apps/x/pnpm-lock.yaml"
      - "apps/x/packages/shared/src/branding.ts"
      - "apps/x/packages/core/src/mcp/product-approval.ts"
      - "apps/x/packages/core/src/mcp/product-approval.test.ts"
      - "apps/x/apps/main/src/deeplink.ts"
      - "packages/oauth-resource-server-go/**"
      - "packages/oauth-resource-server-ts/**"
      - "docs/deployment-examples/product-resource-server.env.example"
      - "apps/rfc/012-connector-suite-and-consent-broker.md"
      - "apps/rfc/020-native-third-party-action-engine.md"
      - ".github/workflows/connector-deployment-contract.yml"
  push:
    branches: [develop, main]
    paths:
      - "charts/hydra/**"
      - "charts/rowboat-api/**"
      - "charts/rowboat-www/**"
      - "charts/oauth-consent/**"
      - "apps/rowboat-www/app/api/connectors/**"
      - "apps/rowboat-www/lib/auth/origin.ts"
      - "apps/rowboat-www/lib/connectors/hosted-oauth.ts"
      - "apps/rowboat-api/internal/connectors/default_connectors.json"
      - "apps/rowboat-api/internal/connectors/registry.go"
      - "apps/oauth-consent/**"
      - "apps/x/package.json"
      - "apps/x/pnpm-lock.yaml"
      - "apps/x/packages/shared/src/branding.ts"
      - "apps/x/packages/core/src/mcp/product-approval.ts"
      - "apps/x/packages/core/src/mcp/product-approval.test.ts"
      - "apps/x/apps/main/src/deeplink.ts"
      - "packages/oauth-resource-server-go/**"
      - "packages/oauth-resource-server-ts/**"
      - "docs/deployment-examples/product-resource-server.env.example"
      - "apps/rfc/012-connector-suite-and-consent-broker.md"
      - "apps/rfc/020-native-third-party-action-engine.md"
      - ".github/workflows/connector-deployment-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Generated clients, charts, Hydra v2, and desktop approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/x/pnpm-lock.yaml
      - name: Install desktop workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x
      - name: Run connector deployment-contract acceptance
        run: ./charts/hydra/tests/deployment-contract.sh

  network-policy-kind:
    name: Migrations, readiness, and enforced NetworkPolicies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.27.0
      - name: Run production-shaped network-policy acceptance
        run: ./charts/hydra/tests/network-policy-kind.sh

  oauth-consent-release-postgres:
    name: oauth-consent release PostgreSQL state machine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/oauth-consent/package-lock.json
      - name: Run mandatory real PostgreSQL consent tests
        run: npm run test:release
        working-directory: apps/oauth-consent
