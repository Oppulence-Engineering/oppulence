name: Rowboat Build

on:
  pull_request:
  # Keep the build available for every develop-to-main promotion PR.

jobs:
  build-rowboat-www:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so the gitleaks history scan can distinguish new
          # commits from content already reviewed on main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache-dependency-path: "clients/apps/web/package-lock.json"
          node-version: "24"
          cache: "npm"

      - name: Setup Go for security scanners
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Setup Python for Semgrep
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci
        working-directory: clients/apps/web

      - name: Install browser quality dependencies
        run: npx playwright install --with-deps chromium webkit
        working-directory: clients/apps/web

      - name: Verify rowboat-www
        run: npm run verify:ci
        working-directory: clients/apps/web
