name: x perf-lite

# The cheap, backend-less slice of the desktop perf gate: build the renderer and
# assert its asset size stays under the rendererAssetSizeMb budget (the same
# tools/desktop-perf/budget.json the full nightly gate uses). The full gate —
# which needs the kind/API stack — stays nightly (desktop-perf-nightly.yml).
on:
  pull_request:
    paths:
      - "clients/apps/desktop/**"
      - "tools/desktop-perf/budget.json"
      - "scripts/perf-lite.mjs"
      - ".github/workflows/x-perf-lite.yml"

jobs:
  perf-lite:
    name: renderer bundle-size budget
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "clients/apps/desktop/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: clients/apps/desktop

      - name: Build shared/core/preload (TypeScript)
        run: npm run deps
        working-directory: clients/apps/desktop

      - name: Build renderer
        run: pnpm exec vite build
        working-directory: clients/apps/desktop/apps/renderer

      - name: Check renderer bundle-size budget
        run: node scripts/perf-lite.mjs
