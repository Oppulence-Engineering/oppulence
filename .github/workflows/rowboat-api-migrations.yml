name: Oppulence API Migrations

on:
  pull_request:
    paths:
      - "server/ent/schema/**"
      - "server/migrations/postgres/**"
      - "server/cmd/migrate/**"
      - "server/Makefile"
      - "server/policy/**"
      - ".github/workflows/rowboat-api-migrations.yml"
  push:
    branches: [develop, main]
    paths:
      - "server/ent/schema/**"
      - "server/migrations/postgres/**"
      - "server/cmd/migrate/**"
      - "server/Makefile"
      - "server/policy/**"
      - ".github/workflows/rowboat-api-migrations.yml"

permissions:
  contents: read

jobs:
  migration-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install pinned Atlas Community CLI
        run: make install-atlas
        working-directory: server
      - name: Validate and lint versioned migrations
        run: make migration-validate migration-lint
        working-directory: server
