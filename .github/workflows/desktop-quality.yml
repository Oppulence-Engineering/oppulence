name: Desktop Quality Gates

on:
  pull_request:
    paths:
      - "apps/x/**"
      - ".github/workflows/desktop-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/x/pnpm-lock.yaml

      - name: Setup Go for security and policy scanners
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Install architecture security tools
        run: |
          python -m pip install semgrep==1.164.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          go install github.com/open-policy-agent/conftest@v0.69.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Run desktop quality gates
        run: npm run quality
        working-directory: apps/x

      - name: Run conversation intelligence evaluation gate
        run: npm run test:conversation-eval
        working-directory: apps/x/packages/core
