name: Deploy rowboat-www to App Platform

on:
  push:
    branches: [main]
    paths:
      - "clients/apps/web/**"
      - "clients/packages/ui/**"
      - "clients/packages/relationship-contract/**"
      - "clients/packages/eslint-plugin-web/**"
      - "scripts/rowboat-www-smoke.sh"
      - ".do/rowboat-www-production.yaml"
      - ".github/workflows/rowboat-www-app-platform.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/apps/web/package-lock.json
      - run: npm ci
        working-directory: clients/apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: clients/apps/web
      - run: npm run verify:fast
        working-directory: clients/apps/web
      - run: npm run arch
        working-directory: clients/apps/web
      - run: npm run contracts:check
        working-directory: clients/apps/web
      - run: npm run queries:check
        working-directory: clients/apps/web
      - run: npm run security:semgrep
        working-directory: clients/apps/web
      - run: npm run test
        working-directory: clients/apps/web
      - run: npm run build
        working-directory: clients/apps/web

  deploy:
    needs: quality
    uses: Oppulence-Engineering/shared-workflows/.github/workflows/digitalocean-app-platform.yml@39e73ce91a0280405ae5bfd35ef7834b2f96c58f # v1.2.0
    with:
      app_id: ${{ vars.ROWBOAT_WWW_APP_ID }}
      app_spec_path: .do/rowboat-www-production.yaml
      deploy_ref: refs/heads/main
      environment: production
      doctl_version: 1.183.0
      timeout_minutes: 90
      build_image: true
      image_registry_type: GHCR
      image_registry: playbookmediallc
      image_repository: rowboat-www
      dockerfile_path: clients/apps/web/Dockerfile
      build_context: .
      # Version skew protection: an open tab from an older deploy reloads.
      build_args: NEXT_DEPLOYMENT_ID=${{ github.sha }}
      healthcheck_url: ${{ vars.ROWBOAT_WWW_HEALTHCHECK_URL }}
      healthcheck_attempts: 30
      healthcheck_interval_seconds: 10
    secrets:
      digitalocean_token: ${{ secrets.DIGITALOCEAN_PRODUCTION_TOKEN }}
