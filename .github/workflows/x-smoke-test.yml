name: x CI

# Layered PR gate for the desktop app (cheapest checks first, VS Code style):
# install → build deps → renderer typecheck → lint → unit tests → package →
# Playwright-Electron smoke (drives the packaged build via _electron.launch).
on:
  pull_request:
    paths:
      - "apps/x/**"
      - ".github/scripts/x-smoke-package-linux.mjs"
      - ".github/workflows/x-smoke-test.yml"

jobs:
  x-ci-linux:
    name: typecheck · lint · unit · package · e2e
    runs-on: ubuntu-latest
    env:
      # _electron.launch uses the app's own Electron — no Playwright browsers needed.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/x/pnpm-lock.yaml"

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/x/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Build shared/core/preload (TypeScript)
        run: npm run deps
        working-directory: apps/x

      # ----- cheapest gates first: typecheck → lint → unit -----
      - name: Typecheck renderer
        run: pnpm exec tsc -b
        working-directory: apps/x/apps/renderer

      - name: Lint apps/x
        run: npm run lint
        working-directory: apps/x

      - name: Unit tests
        run: npm test
        working-directory: apps/x

      # ----- build the product, then drive it -----
      - name: Package electron app (no publish, no signing)
        run: node .github/scripts/x-smoke-package-linux.mjs

      - name: Verify packaged binary exists
        id: packaged-binary
        run: |
          set -euo pipefail

          # Read the packaged names from the Forge config rather than hardcoding them,
          # matching what release.yml already does. They were hardcoded to the
          # pre-Oppulence product name, so this step could not find the binary after
          # the rename — and no code PR happened to run this workflow in between.
          APP_NAME="$(node -p "require('./apps/x/apps/main/forge.config.cjs').packagerConfig.name ?? 'Oppulence'")"
          EXE_NAME="$(node -p "require('./apps/x/apps/main/forge.config.cjs').packagerConfig.executableName ?? 'oppulence'")"

          EXPECTED_BIN="apps/x/apps/main/out/${APP_NAME}-linux-x64/${EXE_NAME}"
          BIN=""

          for attempt in $(seq 1 60); do
            if [ -f "$EXPECTED_BIN" ]; then
              BIN="$EXPECTED_BIN"
              break
            fi

            BIN="$(find . -path "*/out/*/${EXE_NAME}" -type f -perm -111 -print -quit)"
            if [ -n "$BIN" ]; then
              break
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Waiting for packaged binary from Forge..." >&2
            fi
            sleep 1
          done

          if [ -z "${BIN:-}" ] || [ ! -f "$BIN" ]; then
            echo "Packaged binary not found at $EXPECTED_BIN; searched package output." >&2
            find . -maxdepth 6 -type d -name out -print -exec find {} -maxdepth 3 -type f -print \; | sort | sed 's/^/  /' >&2
            exit 1
          fi

          # Emit an absolute path so the e2e step (run from apps/x/apps/main) resolves it.
          BIN_ABS="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"
          echo "bin=$BIN_ABS" >> "$GITHUB_OUTPUT"
          file "$BIN_ABS"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Verify packaged Electron fuses
        # Playwright requires --inspect=0 for its main-process connection. The
        # smoke packager enables that single fuse only in this unsigned CI build.
        run: pnpm fuses:verify -- --allow-node-cli-inspect "${{ steps.packaged-binary.outputs.bin }}"
        working-directory: apps/x

      - name: Playwright-Electron smoke (xvfb)
        run: xvfb-run -a pnpm exec playwright test
        working-directory: apps/x/apps/main
        env:
          ELECTRON_APP_BINARY: ${{ steps.packaged-binary.outputs.bin }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/x/apps/main/playwright-report/
            apps/x/apps/main/test-results/
          if-no-files-found: ignore
          retention-days: 7
